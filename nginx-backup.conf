server {
    server_name valentin-marot.fr www.valentin-marot.fr;

    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Logs
    access_log /var/log/nginx/valentin-marot.fr.access.log;
    error_log /var/log/nginx/valentin-marot.fr.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/valentin-marot.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/valentin-marot.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}
server {
    if ($host = www.valentin-marot.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = valentin-marot.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name valentin-marot.fr www.valentin-marot.fr;
    return 404; # managed by Certbot




}