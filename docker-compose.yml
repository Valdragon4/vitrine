version: '3.8'

services:
  vitrine:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: valentin-marot-vitrine
    restart: unless-stopped
    ports:
      - "3002:3000"  # Port externe 3002, port interne 3000
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Code source modifiable - utilisation de bind mounts
      - type: bind
        source: /opt/vitrine/src
        target: /app/src
      - type: bind
        source: /opt/vitrine/public
        target: /app/public
      - type: bind
        source: /opt/vitrine/.env.local
        target: /app/.env.local
    networks:
      - vitrine-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  vitrine-network:
    driver: bridge
