name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Runner auto-hébergé sur valdragon2 : le build (Next.js + three.js) tourne
    # sur la machine applicative. Server (Core 2 Duo, reverse-proxy nginx) ne
    # fait que recevoir l'image et redémarrer le conteneur — il ne build jamais.
    runs-on: [self-hosted, valdragon2]

    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image (valdragon2)
        run: |
          cp ~/vitrine-deploy/.env .env
          docker compose -p vitrine build

      - name: Image de retour arrière sur Server
        run: |
          ssh Server 'docker tag "$(docker inspect valentin-marot-vitrine --format "{{.Image}}")" vitrine-vitrine:rollback || true'

      - name: Transfert de l'image vers Server
        run: docker save vitrine-vitrine:latest | gzip -1 | ssh Server 'gunzip | docker load'

      - name: Déploiement sur Server
        run: |
          ssh Server 'cd ~/vitrine && git fetch origin main && git reset --hard origin/main && docker compose up -d --no-build'

      - name: Vérification
        run: |
          sleep 15
          ssh Server 'curl -fsS -o /dev/null http://localhost:3002'
          curl -fsS -o /dev/null https://valentin-marot.fr
          echo "Deployment completed successfully!"

      - name: Nettoyage des images orphelines
        run: docker image prune -f
